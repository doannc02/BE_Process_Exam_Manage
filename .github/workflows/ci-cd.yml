name: Deploy to Production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up .NET
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: "6.0.x" # Sử dụng phiên bản .NET Core 6

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Publish
        run: dotnet publish --configuration Release -o ~/BE_Process_Exam_Manage/ExamProcessManage/deploy-pem/be/publish

      - name: Deploy to Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }} # Đặt SSH key trong Secrets
          SERVER_IP: ${{ secrets.SERVER_IP }} # Đặt địa chỉ IP server trong Secrets
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          SERVER_USER: ${{ secrets.SERVER_USER }} # Đặt tên người dùng trong Secrets
        run: |
          # Tạo file chứa khóa SSH
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Khởi động ssh-agent và thêm khóa SSH
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

          # Kết nối đến server và sao chép files qua cổng 9001
          scp -o StrictHostKeyChecking=no -P 9001 -r ~/BE_Process_Exam_Manage/ExamProcessManage/deploy-pem/be/publish/* $SERVER_USER@$SERVER_IP:~/BE_Process_Exam_Manage/ExamProcessManage/deploy-pem/be/publish

          # Khởi động lại Nginx sau khi sao chép file qua cổng 9001
          ssh -o StrictHostKeyChecking=no -p 9001 $SERVER_USER@$SERVER_IP 'sudo systemctl restart nginx'

          # Xóa file khóa SSH sau khi sử dụng
          rm ~/.ssh/id_rsa
