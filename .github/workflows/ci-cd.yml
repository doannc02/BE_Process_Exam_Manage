name: Deploy to Server

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Print working directory
        run: pwd
        
      - name: List files
        run: ls -R
        
      - name: Set up SSH and Publish Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 9001
          script: |
            cd BE_Process_Exam_Manage/ExamProcessManage
            pwd
            ls
            rm -rf ./publish
            dotnet publish ExamProcessManage.csproj -c Release -o ./publish -p:NoWarn=CS8601,CS8602,CS8629,CS8714 -v diag || { echo "Publish failed"; exit 1; }
            ls ./publish  # Kiểm tra xem thư mục publish có tồn tại hay không
            scp -P 9001 -r ./publish/* ${{ secrets.USERNAME }}@${{ secrets.HOST }}:~/BE_Process_Exam_Manage/ExamProcessManage/publish/
