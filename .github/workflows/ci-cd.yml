name: Deploy to Server

on:
  push:
    branches:
      - production # Thay đổi nếu bạn muốn deploy từ nhánh khác

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username:  ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 9001

      - name: Publish application
        run: |
           ssh -p 9001 ${{ secrets.USERNAME }}@${{ secrets.HOST }} "rm -rf ~/BE_Process_Exam_Manage/ExamProcessManage/publish/*"
           scp -P 9001 -r ~/BE_Process_Exam_Manage/ExamProcessManage/publish/* ${{ secrets.USERNAME }}@${{ secrets.HOST }}:~/BE_Process_Exam_Manage/ExamProcessManage/publish/
