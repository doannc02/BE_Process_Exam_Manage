name: Deploy to Server

on:
  push:
    branches:
      - production # Thay đổi nếu bạn muốn deploy từ nhánh khác

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secret.HOST }}
          username:  ${{ secret.USERNAME }}
          password: ${{ secret.PASSWORD }}
          port: 9001

      - name: Publish application
        run: |
          # Nếu cần, cài đặt các phụ thuộc hoặc chạy build trước khi publish
          # dotnet publish -c Release -o ~/BE_Process_Exam_Manage/ExamProcessManage/publish

          # Xóa các file cũ trên server
          ssh -p 9001 ${{ secrets.USERNAME }}@${{ secrets.SERVER_IP }} "rm -rf ~/BE_Process_Exam_Manage/ExamProcessManage/publish/*"

          # Sao chép các file đã publish từ repository lên server
          scp -P 9001 -r ~/BE_Process_Exam_Manage/ExamProcessManage/publish/* ${{ secrets.USERNAME }}@${{ secrets.SERVER_IP }}:~/BE_Process_Exam_Manage/ExamProcessManage/publish/
